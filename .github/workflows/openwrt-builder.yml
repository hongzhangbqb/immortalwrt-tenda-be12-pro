name: BE12 Pro OpenClash
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Shanghai
      CCACHE_DIR: /workdir/openwrt/.ccache
    steps:
      - name: Checkout custom build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Load verified build kit
        run: |
          echo '9a917ed9492dcab218908fbbeda74ee2ec3f7104546f254f6b7d81ce9e7513e2  BE12-Pro-OpenClash-build.zip' | sha256sum -c -
          unzip -o BE12-Pro-OpenClash-build.zip -x '.github/*'
      - name: Prepare disposable Linux runner
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar file flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils qemu-user-static rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir
          mkdir -p /workdir/result
          df -h /workdir
      - name: Pin sources and resolve device configuration
        working-directory: /workdir
        run: bash "$GITHUB_WORKSPACE/build/prepare.sh" "$GITHUB_WORKSPACE"
      - name: Restore the October build revision after verifying source identity
        working-directory: /workdir/openwrt
        run: |
          source "$GITHUB_WORKSPACE/build/locks.env"
          test "$(git rev-parse HEAD)" = "$SOURCE_REV"
          original=$(cat "$GITHUB_WORKSPACE/baseline/orig-build.version")
          test "$original" = "r1-${SOURCE_REV:0:9}"
          echo "Revision from detached checkout: $(./scripts/getver.sh); October release: $original"
          printf '%s\n' "$original" > version
          test "$(./scripts/getver.sh)" = "$original"
      - name: Compile both images
        working-directory: /workdir/openwrt
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 4G
          make download -j8 || make download -j1 V=s
          make -j"$(nproc)" || make -j1 V=s
      - name: Check image headers, package set, drivers and core
        working-directory: /workdir/openwrt
        run: |
          staging_dir/host/bin/fwtool -i /tmp/be12-meta.json bin/targets/mediatek/filogic/*tenda_be12-pro-squashfs-sysupgrade.bin
          cat /tmp/be12-meta.json
          bash "$GITHUB_WORKSPACE/build/inspect.sh" "$GITHUB_WORKSPACE" /workdir/result
      - name: Deliver verified images and build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: be12-pro-openclash-0.48.002-${{ github.run_id }}
          path: /workdir/result/
          if-no-files-found: error
          compression-level: 0
